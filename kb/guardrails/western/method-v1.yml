    precision_any: []
    blocks: [single_aspect_verdict, automatic_compatibility_verdict, automatic_breakup_verdict]
    lowers_confidence: []
    display: blocked
    reason: "合盤只能辨認關係中的相容區與低相容區；不可用單一相位直接判斷關係成敗或復合結果。"

  - id: western-guardrail-no-sun-sign-pairing
