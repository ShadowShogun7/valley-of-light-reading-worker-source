version: kb-guardrails-v1
guardrail_id: western-method-v1
applies_to:
  products: [relationship_compatibility]
  stages: [in_relationship, in_breakup, all]
  questions: [still-love-me, any-chance, when-to-contact, what-did-i-do-wrong, stay-or-let-go]

guardrails:
  - id: western-guardrail-no-single-aspect-verdict
    system: western
    category: method
    source_article_id: western-synastry-method
    claim_ids:
      - western-synastry-method-001
    applies_to: [synastry_aspect, reading_blueprint, narrative]
