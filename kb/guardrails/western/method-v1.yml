    display: blocked
    reason: "George/Bloch 明確要求讀盤超越太陽星座；太陽星座或同元素只能作為起點，不可寫成完整相容判斷。"

  - id: western-guardrail-relationship-needs-before-compatibility
    system: western
    category: method
    source_article_id: western-relationship-needs-george-bloch
    claim_ids:
