version: kb-book-digests-v1
digests:
  - id: western-suskin-synastry-method-digest
    source_id: western-suskin-synastry
    lane: astrology_method
    status: reviewed
    priority: P0
    product_role: Primary Western relationship reading order.
    method_scope:
      - natal_relationship_potential
      - initial_comparison
      - interchart_aspects
      - relationship_chart_deferral
      - timing_deferral
      - consultation_safety
    extraction_goal: Turn Suskin into the operational sequence for relationship readings before adding more UI copy.
    method_claims:
      - id: suskin-method-order-natal-before-synastry
        claim_type: method_order
        summary: Read each person's relationship capacity and needs before judging the relationship between them.
        use_for:
          - Start V1 with 我的星盤 and 他的星盤.
          - Prevent single-aspect conclusions from driving the answer.
        runtime_targets:
          - identityNeeds
          - relationshipPotential
          - readingBlueprint
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-synastry-method-order
          - western-natal-relationship-potential
        source_locations:
          - raw/western/718226037-Synastry-Understanding-the-Astrology-of-Relationships-Rod-Suskin-Z-Library.txt:276-294
          - raw/western/718226037-Synastry-Understanding-the-Astrology-of-Relationships-Rod-Suskin-Z-Library.txt:945-987
        review_notes:
          - Suskin explicitly orders natal relationship needs before chart-to-chart analysis.
          - This supports starting the paid result with separate profile layers before the question answer.
        must_not_claim:
          - Do not answer whether someone will return before showing each person's relationship function layer.
      - id: suskin-method-order-comparison-is-orientation
        claim_type: method_order
        summary: Initial element/luminary comparison can orient the reading but cannot become a compatibility verdict.
        use_for:
          - Explain natural rhythm and mismatch without saying compatible or incompatible.
        runtime_targets:
          - elementComparison
          - luminaryComparison
          - fitSummary
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-initial-comparison-elements
        source_locations:
          - raw/western/718226037-Synastry-Understanding-the-Astrology-of-Relationships-Rod-Suskin-Z-Library.txt:465-545
          - raw/western/718226037-Synastry-Understanding-the-Astrology-of-Relationships-Rod-Suskin-Z-Library.txt:276-294
        review_notes:
          - Suskin rejects Sun-sign compatibility shortcuts and frames compatibility through needs, communication, rapport, empathy, compromise, and values.
          - This supports using fitSummary as orientation, not verdict.
        must_not_claim:
          - Do not treat element match as proof of love, return, or long-term success.
      - id: suskin-method-order-aspects-after-foundation
        claim_type: method_order
        summary: Interchart aspects matter after natal foundations and should be prioritized, not dumped as a list.
        use_for:
          - Select a few relationship-critical aspect families for attraction, safety, pressure, communication, and repair.
        runtime_targets:
          - aspectPriority
          - attraction
          - emotionalSafety
          - pressure
          - communication
          - repair
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-interchart-aspect-priorities
        source_locations:
          - raw/western/718226037-Synastry-Understanding-the-Astrology-of-Relationships-Rod-Suskin-Z-Library.txt:276-294
          - raw/western/718226037-Synastry-Understanding-the-Astrology-of-Relationships-Rod-Suskin-Z-Library.txt:105-116
        review_notes:
          - Suskin puts chart interaction after natal foundations and table-of-contents structure separates basic comparison from interchart aspect work.
          - This supports prioritizing evidence families instead of dumping every calculated contact.
        must_not_claim:
          - Do not show all aspects just because the calculator can produce them.
      - id: suskin-method-order-relationship-chart-later
        claim_type: method_order
        summary: Relationship chart layers belong after natal comparison and synastry; do not invent composite or Davison meaning before those calculations exist.
        use_for:
          - Keep composite and Davison out of V1 until the calculation layer is reliable.
        runtime_targets:
          - relationshipChartLayer
          - compositeLayer
        implementation_status: blocked
        evidence_level: source_backed
        source_basis:
          - western-relationship-chart-layer
        source_locations:
          - raw/western/718226037-Synastry-Understanding-the-Astrology-of-Relationships-Rod-Suskin-Z-Library.txt:293-299
          - raw/western/718226037-Synastry-Understanding-the-Astrology-of-Relationships-Rod-Suskin-Z-Library.txt:550-580
        review_notes:
          - Suskin places relationship charts after natal and synastry method, so V1 should not invent composite or Davison evidence.
          - This source support keeps relationshipChartLayer intentionally blocked until calculations exist.
        must_not_claim:
          - Do not imply composite, Davison, houses, or overlays were calculated when they were not.

  - id: western-hand-horoscope-symbols-method-digest
    source_id: western-hand-horoscope-symbols
    lane: astrology_method
    status: reviewed
    priority: P0
    product_role: Foundation for planets, signs, houses, aspects, angles, and symbol grammar.
    method_scope:
      - planetary_functions
      - sign_style
      - element_modality
      - aspect_meaning
      - house_angle_precision
    extraction_goal: Use Hand as the foundation grammar so product language does not become generic sign stereotypes.
    method_claims:
      - id: hand-symbol-grammar-planet-function-sign-style
        claim_type: symbol_foundation
        summary: Planet shows the function; sign shows style; interpretation should not collapse into Sun-sign or sign-only reading.
        use_for:
          - Explain Moon, Mercury, Venus, Mars, and Saturn as relationship functions.
          - Keep the first paragraph of each card definition-only before relation synthesis.
        runtime_targets:
          - planetaryFunctions
          - planetSignStyle
          - moonSignEmotionalSafety
          - mercurySignCommunicationRepair
          - venusSignAffectionStyle
          - marsSignPursuitConflict
          - saturnSignDefenseDelay
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-planetary-functions-hand
          - western-individual-sign-meanings-hand
          - western-relationship-function-sign-templates
        source_locations:
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:527-555
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:758-771
        review_notes:
          - Hand defines planets, angles, aspects, houses, and signs as separate symbol systems.
          - Hand frames signs and houses as modifiers/backdrops rather than the same kind of energy as planets, supporting function-plus-style rendering.
        must_not_claim:
          - Do not say one sign alone proves a person's feelings or action.
      - id: hand-planet-pair-function-fields
        claim_type: symbol_foundation
        summary: Moon/Mercury, Venus/Mars, and Jupiter/Saturn describe different function fields; relationship profiles should keep reception, communication, attraction, action, and limits distinct.
        use_for:
          - Prevent profile cards from repeating one generic sign meaning across every planet.
          - Support the five-function profile sequence before synastry judgment.
        runtime_targets:
          - planetaryFunctions
          - planetSignStyle
          - functionElementMatrix
          - functionModalityMatrix
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-planets-planetary-functions-hand
          - western-relationship-function-sign-templates
        source_locations:
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:1213-1299
        review_notes:
          - Hand separates Mercury/Moon modulation, Venus/Mars relationship polarity, and Jupiter/Saturn support/resistance.
          - This strengthens the product rule that sign language must be routed through the planet's function field.
        must_not_claim:
          - Do not use one sign description as if it means the same thing for Moon, Mercury, Venus, Mars, and Saturn.
      - id: hand-moon-emotional-containment-belonging
        claim_type: natal_profile
        summary: Moon describes containment, nurture, belonging, emotional reflex, and early patterns; Moon-in-sign should explain felt safety and regulation.
        use_for:
          - Make Moon profile cards explain emotional safety before relationship conclusions.
          - Keep low-confidence Moon handling when birth time is missing.
        runtime_targets:
          - moonSignEmotionalSafety
          - identityNeeds
          - emotionalSafety
          - readableInterpretation
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-planets-planetary-functions-hand
          - western-relationship-function-sign-templates
        source_locations:
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:1621-1797
        review_notes:
          - Hand grounds Moon in containment, nurturing matrix, belonging, unconscious emotional assumptions, and reflexive emotional response.
          - This supports writing Moon as "what makes the nervous system feel safe enough to receive," not as proof of the other person's feelings.
        must_not_claim:
          - Do not use Moon sign to write definite inner monologue, guaranteed love, or guaranteed return.
      - id: hand-mercury-communication-translation-map
        claim_type: natal_profile
        summary: Mercury bridges separateness through communication, symbol-making, translation, mapmaking, and detail processing.
        use_for:
          - Make Mercury profile cards explain how words are received, translated, and repaired.
          - Keep repair advice tied to communication mechanics instead of comfort-only advice.
        runtime_targets:
          - mercurySignCommunicationRepair
          - communication
          - repair
          - readableInterpretation
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-planets-planetary-functions-hand
          - western-relationship-function-sign-templates
        source_locations:
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:1798-1989
        review_notes:
          - Hand frames Mercury as the process that converts experience into symbols, maps, language, and transferable understanding.
          - This supports using Mercury for message framing, misunderstanding, and repair tone, not as proof that contact will happen.
        must_not_claim:
          - Do not use Mercury sign alone to predict a reply, prescribe one exact sentence, or prove feeling.
      - id: hand-venus-voluntary-attraction-harmony
        claim_type: natal_profile
        summary: Venus describes voluntary attraction, harmony, affection, beauty, and self-expressive bonding; attraction cannot be upgraded into commitment.
        use_for:
          - Make Venus profile cards explain how affection and attraction naturally open.
          - Separate liking, comfort, and attraction from commitment or repair capacity.
        runtime_targets:
          - venusSignAffectionStyle
          - attraction
          - safetyValidationLanguage
          - readableInterpretation
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-planets-planetary-functions-hand
          - western-relationship-function-sign-templates
        source_locations:
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:1990-2132
        review_notes:
          - Hand distinguishes voluntary Venus bonding from coercive forces and stresses that healthy Venus allows self-expression rather than loss of individuality.
          - This supports writing attraction as a low-pressure opening, not a promise of commitment or return.
        must_not_claim:
          - Do not say Venus sign proves love, commitment, loyalty, reply, or reconciliation.
      - id: hand-mars-individuality-action-conflict
        claim_type: natal_profile
        summary: Mars describes individuality, survival energy, assertion, action, conflict, desire, and the need to balance selfhood with Venusian relating.
        use_for:
          - Make Mars profile cards explain pursuit rhythm and conflict triggers without blame.
          - Separate active charge from commitment, safety, or repair.
        runtime_targets:
          - marsSignPursuitConflict
          - pressure
          - attraction
          - actionDirection
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-planets-planetary-functions-hand
          - western-relationship-function-sign-templates
        source_locations:
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:2133-2256
        review_notes:
          - Hand frames Mars as the energy that maintains individuality and can become conflict when two Mars fields cannot operate in the same space.
          - He also ties healthy relating to a Mars/Venus balance, supporting non-blaming action and conflict language.
        must_not_claim:
          - Do not use Mars sign to assign fault, diagnose aggression, guarantee sexual attraction, or guarantee reconciliation.
      - id: hand-saturn-limits-reality-structure
        claim_type: natal_profile
        summary: Saturn describes limits, rules, reality structure, resistance, maturity, and rigidity risk; Saturn pressure must stay nonfatal.
        use_for:
          - Make Saturn profile cards explain defense, delay, boundary, and pressure.
          - Keep timing/action advice from turning Saturn into permanent rejection or fated waiting.
        runtime_targets:
          - saturnSignDefenseDelay
          - pressure
          - timingSaturnPressure
          - actionBoundary
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-planets-planetary-functions-hand
          - western-relationship-function-sign-templates
        source_locations:
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:2413-2598
        review_notes:
          - Hand rehabilitates Saturn from simple malefic status and defines it through limits, rules, structure, social reality, responsibility, and potential rigidity.
          - This supports pressure language that names boundaries and delay without writing doom, punishment, or permanent rejection.
        must_not_claim:
          - Do not say Saturn means the relationship is doomed, the person does not love the user, or the user should wait indefinitely.
      - id: hand-symbol-grammar-house-angle-gate
        claim_type: precision_guardrail
        summary: Houses and angles require reliable time and location; they should be blocked when precision is weak.
        use_for:
          - Prevent Asc, Desc, houses, and overlays from appearing under missing birth time or city.
        runtime_targets:
          - birthDataQuality
          - angleHouseFramework
          - houseOverlayLayer
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-houses-angles-foundation
          - western-birth-data-quality
        source_locations:
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:944-1090
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:983-1001
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:1074-1089
        review_notes:
          - Hand ties angles and houses to horizon/meridian and mundane position, making time/place reliability essential for this layer.
          - This supports blocking Asc, Desc, houses, and overlays under weak birth data.
          - Hand also distinguishes definite angles from approximate house positions, so runtime output needs a precision-gated contextual trace instead of silent narrative use.
        must_not_claim:
          - Do not mention house overlays or Desc patterns without time/place precision.
          - Do not use house or angle context as a substitute for calculated synastry, transit, or relationship-chart evidence.
      - id: hand-symbol-grammar-aspect-synthesis
        claim_type: aspect_foundation
        summary: Aspects describe relationship between functions; interpretation needs aspect type, participating points, and strength.
        use_for:
          - Require pair family plus contact type plus confidence instead of generic hard/soft wording.
        runtime_targets:
          - aspectInterpretationFoundation
          - aspectContactModifier
          - aspectFunctionCombination
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-aspect-interpretation-foundation
          - western-aspect-contact-type-modifiers
          - western-aspect-function-combination-reducers
        source_locations:
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:3820-3850
          - raw/western/horoscope-symbols-robert-hand-extracted.txt:527-555
        review_notes:
          - Hand defines aspects as angular relationships that link planetary energies and other chart points in aspect-specific ways.
          - This supports aspect reducers that require participating functions, contact type, and strength.
        must_not_claim:
          - Do not treat any one aspect as a guaranteed event.

  - id: western-george-bloch-natal-method-digest
    source_id: western-george-bloch-astrology-for-yourself
    lane: astrology_method
    status: reviewed
    priority: P0
    product_role: Natal synthesis cross-check and relationship-needs method.
    method_scope:
      - natal_synthesis
      - sun_moon_asc
      - relationship_needs
      - element_modality
      - aspect_synthesis
    extraction_goal: Cross-check Hand and Suskin with an educational chart-reading sequence.
    method_claims:
      - id: george-bloch-natal-synthesis-before-answer
        claim_type: method_order
        summary: User-facing relationship answers need natal synthesis before synastry, especially Moon, Venus, Mars, Mercury, Saturn, and Asc when allowed.
        use_for:
          - Give each person a clear profile before answering the question.
        runtime_targets:
          - relationshipProfiles
          - identityNeeds
          - functionElementMatrix
          - functionModalityMatrix
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-astrology-for-yourself-method-foundation
          - western-relationship-needs-george-bloch
          - western-function-element-templates
          - western-function-modality-templates
        source_locations:
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:1468-1492
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:5566-5595
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:6108-6128
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:6954-7004
        review_notes:
          - George/Bloch frame planets as functions, signs as expression style, and houses as fields of experience.
          - Their relationship section treats each birth chart as a unique needs map before partnership comparison.
        must_not_claim:
          - Do not reduce a person to a Sun sign or one placement.
      - id: george-bloch-function-elements-moon-through-saturn
        claim_type: natal_profile
        summary: Moon, Mercury, Venus, Mars, and Saturn element tables translate emotional security, communication, attraction, assertion, and restriction into function-specific relationship language.
        use_for:
          - Support the function-element matrix in 星盤定位.
          - Keep each planet's element wording tied to the planet's actual relationship function.
        runtime_targets:
          - moonSignEmotionalSafety
          - mercurySignCommunicationRepair
          - venusSignAffectionStyle
          - marsSignPursuitConflict
          - saturnSignDefenseDelay
          - functionElementMatrix
          - readableInterpretation
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-relationship-function-sign-templates
          - western-function-element-templates
        source_locations:
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:1954-2220
        review_notes:
          - George/Bloch give separate element tables for Moon emotional security, Mercury thinking/communication, Venus interaction/attraction, Mars assertion, and Saturn restriction/restructure.
          - This directly supports the runtime design where the same element has different meaning depending on whether it modifies Moon, Mercury, Venus, Mars, or Saturn.
        must_not_claim:
          - Do not let element language replace the planet function, synastry evidence, timing evidence, or real contact context.
          - Do not use element style alone as a compatibility verdict.
      - id: george-bloch-sun-moon-asc-profile-layer
        claim_type: natal_profile
        summary: Sun, Moon, and Ascendant form a primary personality profile layer, but Ascendant claims depend on reliable birth time and location.
        use_for:
          - Show each person's broad profile before synastry when birth data supports it.
          - Keep Asc/Desc language out of low-precision scenarios.
        runtime_targets:
          - relationshipProfiles
          - sunMoonAscProfile
          - birthDataQuality
          - precisionWarnings
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-sun-moon-asc-profile-george-bloch
          - western-birth-data-quality
        source_locations:
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:1722-1818
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:6954-7004
        review_notes:
          - George/Bloch identify Sun, Moon, and Ascendant as primary personality indicators and analyze them through element, polarity, modality, and orientation.
          - Because the Ascendant is tied to the Eastern horizon at birth, product output must use the existing birth-data precision gate.
        must_not_claim:
          - Do not show Ascendant, Descendant, or angle-derived relationship claims when time or place is unreliable.
      - id: george-bloch-aspect-synthesis-cross-check
        claim_type: aspect_foundation
        summary: Aspect interpretation should synthesize planet functions, sign context, and aspect type instead of reading isolated keywords.
        use_for:
          - Audit pair-template language for native, relationship-specific Chinese.
        runtime_targets:
          - aspectSynthesisCrossCheck
          - aspectPairPhraseTemplateMethod
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-aspect-synthesis-george-bloch
          - western-aspect-pair-contact-phrase-templates
        source_locations:
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:4540-4632
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:4632-4718
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:7114-7148
        review_notes:
          - George/Bloch describe aspects as relationships between chart functions that must include planet, sign, house, and aspect meaning.
          - Their hard-aspect section emphasizes integration and resolution potential, supporting nonfatal pressure language.
        must_not_claim:
          - Do not let phrase templates bypass actual calculated aspect evidence.
      - id: george-bloch-relationship-comparison-wants-needs
        claim_type: relationship_method
        summary: Chart comparison is useful because it clarifies how two birth charts interact and helps people understand relationship dynamics, wants, and needs.
        use_for:
          - Keep fit analysis oriented toward mutual needs and dynamics rather than a yes/no compatibility verdict.
          - Support the profile-first reading blueprint before relationship conclusions.
        runtime_targets:
          - relationshipProfiles
          - relationshipPotential
          - fitSummary
          - readingBlueprint
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-relationship-needs-george-bloch
          - western-synastry-evidence-clusters
        source_locations:
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:5578-5585
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:5586-5592
        review_notes:
          - George/Bloch state that the birth chart gives clues to what a person needs and can offer in relationship.
          - Their relationship comparison purpose is understanding chart interaction and fulfilling wants and needs, not declaring fate.
        must_not_claim:
          - Do not turn relationship comparison into a guaranteed marriage, breakup, or reconciliation verdict.
          - Do not use chart interaction language without showing profile and synastry evidence.
      - id: george-bloch-synthesis-salient-themes-first
        claim_type: evidence_selection
        summary: "Chart synthesis should begin with what stands out: salient themes, repeated emphases, and the Sun/Moon/Ascendant profile before smaller details."
        use_for:
          - Support reducer selection of central themes instead of dumping every available placement or aspect.
          - Keep profile output anchored in repeated element/modality/orientation and Sun/Moon/Ascendant patterns.
        runtime_targets:
          - evidenceReducer
          - readingBlueprint
          - relationshipProfiles
          - aspectPriority
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-astrology-for-yourself-method-foundation
          - western-synastry-evidence-clusters
        source_locations:
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:6957-6973
          - raw/western/astrology-for-yourself-george-bloch-extracted.txt:6984-6995
        review_notes:
          - George/Bloch explicitly instruct the interpreter to pay attention to what stands out and to identify salient themes.
          - Their outline then checks element, modality, orientation, and the Sun/Moon/Ascendant layer, matching the current reducer order.
        must_not_claim:
          - Do not present every minor factor as equally important.
          - Do not hide a weak or absent central theme behind a long list of details.

  - id: western-burk-relationship-handbook-method-digest
    source_id: western-burk-relationship-handbook
    lane: astrology_method
    status: reviewed
    priority: P1
    product_role: Practical synastry interpretation and relationship mechanics.
    method_scope:
      - synastry_pair_families
      - personal_planet_contacts
      - relationship_questions
    extraction_goal: Deepen pair-family reducers so common charts do not sound generic.
    method_claims:
      - id: burk-relationship-astrology-people-before-charts
        claim_type: method_order
        summary: Relationship astrology must compare two individuals, not treat the two charts as the relationship itself.
        use_for:
          - Keep V1 ordered as profiles first, synastry second, question answer third.
          - Prevent compatibility verdicts from isolated synastry contacts.
        runtime_targets:
          - relationshipProfiles
          - identityNeeds
          - relationshipPotential
          - readingBlueprint
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-synastry-relationship-framework
          - western-synastry-evidence-clusters
        source_locations:
          - raw/western/469771786-Astrological-Relationship-Handbook-Kevin-B-Burk-2006-Serendipity-Press.txt:720-785
          - raw/western/469771786-Astrological-Relationship-Handbook-Kevin-B-Burk-2006-Serendipity-Press.txt:815-864
        review_notes:
          - Burk explicitly places chart comparison near the end of the process and says relationships occur between individuals, not charts.
          - This supports the paid flow's profile-first structure before compatibility and question-answer sections.
        must_not_claim:
          - Do not let one attractive or difficult synastry aspect answer the whole relationship question.
      - id: burk-safety-validation-needs-before-compatibility
        claim_type: relationship_needs
        summary: Safety and validation needs are central relationship needs; Moon/Venus language should be used before judging compatibility.
        use_for:
          - Strengthen 星盤定位 and relationship fit sections around actual needs.
          - Explain why a connection can feel attractive but still fail to soothe or validate.
        runtime_targets:
          - identityNeeds
          - emotionalSafety
          - safetyValidationLanguage
          - attraction
          - repair
          - fitSummary
        implementation_status: implemented
        evidence_level: source_backed
        source_basis:
          - western-synastry-relationship-framework
          - western-synastry-evidence-clusters
          - western-planets-natal-relationship-needs
          - western-safety-validation-language
        source_locations:
          - raw/western/469771786-Astrological-Relationship-Handbook-Kevin-B-Burk-2006-Serendipity-Press.txt:920-945
          - raw/western/469771786-Astrological-Relationship-Handbook-Kevin-B-Burk-2006-Serendipity-Press.txt:1209-1218
          - raw/western/469771786-Astrological-Relationship-Handbook-Kevin-B-Burk-2006-Serendipity-Press.txt:1338-1350
          - raw/western/469771786-Astrological-Relationship-Handbook-Kevin-B-Burk-2006-Serendipity-Press.txt:2679
