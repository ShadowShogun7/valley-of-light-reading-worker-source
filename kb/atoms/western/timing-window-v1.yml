  - id: western-atom-timing-mercury-communication
    system: western
    layer: timing
    category: timingMercuryCommunication
    label: Mercury 溝通窗口
    source_article_id: western-transits-timing-selector-windows
    claim_ids:
      - western-transits-timing-selector-windows-001
      - western-transits-timing-selector-windows-006
    applies_to:
      products: [relationship_compatibility]
      stages: [all]
      questions: [all]
    selectors:
      transit_points_any: [Mercury]
      natal_points_any: [Sun, Moon, Mercury, Venus, Mars, Saturn]
      timing_categories_any: [communication_window, communication_pressure]
      relationship_functions_any: [communication, repair]
    interpretation:
      summary_template: "{label}掃描到{window_count}個溝通相關 timing 訊號；主軸是：{dominant_window}。"
      empty_summary: "未來三個月掃描內沒有明顯 Mercury 溝通 timing 訊號。"
      interpretation: "Mercury timing 可以支援訊息清晰度、對話節奏與修復語氣，但不保證對方回覆。"
      does_not_prove: "Mercury timing 不證明對方一定會回、不等於復合，也不能替代訊息內容策略。"
      confidence_floor: low

