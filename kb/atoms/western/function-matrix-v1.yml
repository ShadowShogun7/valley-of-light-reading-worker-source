      interpretation: "元素用來修飾 Moon/Mercury/Venus/Mars/Saturn 的關係功能：火象偏直接、土象偏穩定、風象偏對話、水象偏情緒接收。"
      does_not_prove: "元素矩陣不能單獨證明兩人合不合、誰愛誰、是否聯絡、是否承諾或關係會不會回來。"
      confidence_floor: medium

