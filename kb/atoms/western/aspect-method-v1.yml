      empty_summary: "本次沒有可用的 pair-contact 句型方法。"
      interpretation: "先保留 planet pair 的關係功能，再套入 conjunction/soft/hard 語氣；模板只翻譯已計算相位，不新增星盤事實。"
      does_not_prove: "pair-contact 句型不能單獨證明承諾、復合、聯絡或對方內心。"
      confidence_floor: medium

